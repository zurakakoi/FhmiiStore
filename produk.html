<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semua Produk — Fhmii Store</title>
<meta name="description" content="Jelajahi semua produk digital & makanan di Fhmii Store." />

<link rel="stylesheet" href="css/style.css" />
<script>
  (function () {
    var saved = localStorage.getItem("fhmii-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<header class="navbar">
  <div class="wrap navbar-inner">
    <a href="/" class="brand">
      <img src="assets/media/fhmii.png" alt="Fhmii Store" class="brand-logo"
           onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'brand-logo-fallback', textContent:'F'}))" />
      <span class="brand-name">Fhmii Store</span>
    </a>

    <nav class="nav-links">
      <a href="/produk">Produk</a>
      <a href="/produk?type=digital">Digital</a>
      <a href="/produk?type=food">Makanan</a>
      <a href="/#kontak">Kontak</a>
    </nav>

    <div class="nav-actions">
      <button data-theme-toggle class="icon-btn" aria-label="Ganti tema" aria-pressed="false">
        <svg class="dark-icon" style="display:none" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.6 4.6l1.1 1.1M18.3 18.3l1.1 1.1M3 12h1.5M19.5 12H21M4.6 19.4l1.1-1.1M18.3 5.7l1.1-1.1M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/></svg>
        <svg class="light-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <div class="hamburger-wrap">
        <button id="menuBtn" class="icon-btn hamburger" aria-label="Buka menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </div>

  <div id="mobileMenu" class="mobile-menu">
    <a href="/produk">Semua Produk</a>
    <a href="/produk?type=digital">Produk Digital</a>
    <a href="/produk?type=food">Menu Makanan</a>
    <a href="/#kontak">Kontak</a>
  </div>
</header>

<section class="wrap page-hero">
  <h1 class="page-title" id="pageTitle">Semua Produk</h1>
  <p class="page-subtitle" id="pageSubtitle">Digital & makanan, semua ada di sini.</p>

  <div class="filter-tabs">
    <button class="filter-tab" data-filter="">Semua</button>
    <button class="filter-tab" data-filter="digital">Digital</button>
    <button class="filter-tab" data-filter="food">Makanan</button>
  </div>
</section>

<section class="wrap section" style="padding-top: 0;">
  <div id="product-list-grid" class="product-grid"></div>
</section>

<footer id="kontak" class="footer wrap">
  <div class="footer-top">
    <div class="brand">
      <img src="assets/media/fhmii.png" alt="Fhmii Store" class="brand-logo"
           onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'brand-logo-fallback', textContent:'F'}))" />
      <span class="brand-name">Fhmii Store</span>
    </div>
  </div>
  <p class="footer-copyright">© 2026 Fhmii Store. Semua transaksi diproses langsung lewat WhatsApp.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/products.js"></script>
<script src="js/theme.js"></script>
<script>
  // ---- UI logic (jalan duluan) ----
  function syncIcons() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.querySelectorAll(".dark-icon").forEach(el => el.style.display = isDark ? "block" : "none");
    document.querySelectorAll(".light-icon").forEach(el => el.style.display = isDark ? "none" : "block");
  }
  syncIcons();
  document.querySelectorAll("[data-theme-toggle]").forEach(btn => btn.addEventListener("click", () => setTimeout(syncIcons, 0)));

  const menuBtn = document.getElementById("menuBtn");
  const mobileMenu = document.getElementById("mobileMenu");
  if (menuBtn && mobileMenu) {
    menuBtn.addEventListener("click", () => {
      const isOpen = menuBtn.classList.toggle("is-open");
      menuBtn.setAttribute("aria-expanded", isOpen);
      mobileMenu.classList.toggle("is-open");
    });
  }

  try { hydrateWaLinks(); } catch (e) { console.error(e); }

  // ---- Filter berdasarkan query string ?type=digital / ?type=food ----
  const titles = {
    "": { title: "Semua Produk", sub: "Digital & makanan, semua ada di sini." },
    digital: { title: "Produk Digital", sub: "Aplikasi premium, langsung aktif setelah pembayaran." },
    food: { title: "Menu Makanan", sub: "Pesan sekarang, ambil langsung di tempat." },
  };

  function applyFilter(type) {
    document.querySelectorAll(".filter-tab").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.filter === type);
    });
    const info = titles[type] || titles[""];
    document.getElementById("pageTitle").textContent = info.title;
    document.getElementById("pageSubtitle").textContent = info.sub;
    renderProductList("product-list-grid", { type: type || null });

    const url = new URL(window.location);
    if (type) url.searchParams.set("type", type);
    else url.searchParams.delete("type");
    window.history.replaceState({}, "", url);
  }

  document.querySelectorAll(".filter-tab").forEach((btn) => {
    btn.addEventListener("click", () => applyFilter(btn.dataset.filter));
  });

  const initialType = new URLSearchParams(window.location.search).get("type") || "";
  applyFilter(initialType);
</script>
</body>
</html>
