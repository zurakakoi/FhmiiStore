<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Fhmii Store</title>
<link rel="stylesheet" href="../css/style.css" />
<script>
  (function () {
    var saved = localStorage.getItem("fhmii-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<div class="admin-shell">
  <header class="admin-header wrap">
    <a href="/" class="brand">
      <img src="../assets/media/fhmii.png" alt="Fhmii Store" class="brand-logo"
           onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'brand-logo-fallback', textContent:'F'}))" />
      <span class="brand-name">Fhmii Store</span>
    </a>
  </header>

  <main class="admin-main">
    <div class="login-box">
      <div class="icon-circle">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 10-8 0v4h8z"/></svg>
      </div>
      <h1 class="font-display" style="font-size:20px;font-weight:600;margin:0 0 4px;">Admin Fhmii Store</h1>
      <p class="muted" style="font-size:13px;margin:0 0 24px;">Masukkan PIN untuk masuk ke dashboard</p>

      <form id="loginForm">
        <div class="field">
          <label for="pin">PIN Admin</label>
          <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••••" required />
        </div>
        <p class="form-error" id="formError"></p>
        <button type="submit" class="btn-primary btn-block" id="submitBtn">Masuk</button>
      </form>

      <!-- PANEL DEBUG SEMENTARA — hapus nanti kalau udah beres -->
      <div style="margin-top:20px;text-align:left;">
        <p class="muted" style="font-size:11px;margin-bottom:6px;">Debug log:</p>
        <pre id="debugLog" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;margin:0;">Menunggu...</pre>
      </div>
    </div>
  </main>
</div>

<script>
  // ---- Debug logger, tampil di layar ----
  const debugEl = () => document.getElementById("debugLog");
  function log(msg) {
    const time = new Date().toLocaleTimeString("id-ID");
    const el = debugEl();
    if (el) el.textContent += `\n[${time}] ${msg}`;
    console.log(msg);
  }
  window.addEventListener("error", (e) => {
    log(`❌ JS ERROR: ${e.message} (${e.filename}:${e.lineno})`);
  });
  window.addEventListener("unhandledrejection", (e) => {
    log(`❌ PROMISE ERROR: ${e.reason}`);
  });
  log("Halaman dimuat, mulai load script...");
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onload="log('✅ firebase-app-compat.js loaded')" onerror="log('❌ GAGAL load firebase-app-compat.js (cek internet/domain diblokir)')"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onload="log('✅ firebase-firestore-compat.js loaded')" onerror="log('❌ GAGAL load firebase-firestore-compat.js')"></script>
<script src="../js/firebase-config.js" onload="log('✅ firebase-config.js loaded, db siap: ' + (typeof db))" onerror="log('❌ GAGAL load firebase-config.js (cek path/lokasi file)')"></script>
<script src="../js/auth.js" onload="log('✅ auth.js loaded, submitAdminPin: ' + (typeof submitAdminPin))" onerror="log('❌ GAGAL load auth.js (cek path/lokasi file)')"></script>

<script>
  log("Setup form listener...");
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("formError");
  const submitBtn = document.getElementById("submitBtn");

  if (typeof submitAdminPin !== "function") {
    log("⚠️ submitAdminPin BELUM ke-define pas script ini jalan. File auth.js mungkin belum sempet ke-load / ada error di dalamnya.");
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    submitBtn.textContent = "Memeriksa...";
    submitBtn.disabled = true;

    const pin = document.getElementById("pin").value.trim();
    log(`Submit diklik, PIN panjang: ${pin.length} karakter`);

    if (typeof submitAdminPin !== "function") {
      log("❌ submitAdminPin gak ada / bukan function. Berhenti di sini.");
      errorEl.textContent = "Terjadi error internal (lihat debug log di bawah).";
      submitBtn.textContent = "Masuk";
      submitBtn.disabled = false;
      return;
    }

    log("Manggil submitAdminPin()...");
    try {
      submitAdminPin(pin, (msg) => {
        log(`Callback onError jalan: ${msg}`);
        errorEl.textContent = msg;
        submitBtn.textContent = "Masuk";
        submitBtn.disabled = false;
      });
      log("submitAdminPin() dipanggil, nunggu hasil (max 8 detik)...");
    } catch (err) {
      log(`❌ Exception pas manggil submitAdminPin: ${err.message}`);
      errorEl.textContent = "Error internal.";
      submitBtn.textContent = "Masuk";
      submitBtn.disabled = false;
    }
  });
  log("Form listener siap. Silakan masukin PIN & submit.");
</script>
</body>
</html>
