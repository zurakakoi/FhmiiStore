<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Pesanan</title>
<link rel="icon" type="image/png" href="../assets/media/fhmii.png" />
<link rel="stylesheet" href="../css/style.css" />
<script>
  (function () {
    var saved = localStorage.getItem("fhmii-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<div class="admin-shell" id="adminShell" style="display:none;">
  <header class="admin-header wrap">
    <a href="/" class="brand">
      <img src="../assets/media/fhmii.png" alt="Fhmii Store" class="brand-logo"
           onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'brand-logo-fallback', textContent:'F'}))" />
      <span class="brand-name">Fhmii Store <span class="muted" style="font-weight:400;">· Admin</span></span>
    </a>
    <div style="display:flex; gap:8px; align-items:center;">
      <button data-theme-toggle class="icon-btn" aria-label="Ganti tema">
        <svg class="dark-icon" style="display:none" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.6 4.6l1.1 1.1M18.3 18.3l1.1 1.1M3 12h1.5M19.5 12H21M4.6 19.4l1.1-1.1M18.3 5.7l1.1-1.1M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/></svg>
        <svg class="light-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="btn-ghost" id="logoutBtn" style="font-size:13px;padding:8px 16px;">Keluar</button>
    </div>
  </header>

  <main class="admin-main wrap">
    <h1 class="page-title" style="font-size:24px;">Kelola Pesanan</h1>
    <p class="page-subtitle" style="margin-bottom:24px;">Pesanan yang masuk dari website, tandai selesai kalau udah diproses.</p>

    <nav style="margin-bottom:8px;"><a href="/admin" style="color:var(--accent);font-size:13px;font-weight:500;">Dashboard</a> · <a href="/admin/produk" style="color:var(--accent);font-size:13px;font-weight:500;">Produk</a> · <a href="/admin/pengaturan" style="color:var(--accent);font-size:13px;font-weight:500;">Pengaturan</a></nav>

    <div class="filter-tabs">
      <button class="filter-tab active" data-tab="pending">Pending</button>
      <button class="filter-tab" data-tab="selesai">Riwayat</button>
    </div>

    <div id="ordersList"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-orders.js"></script>
<script src="../js/theme.js"></script>
<script>
  function syncIcons() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.querySelectorAll(".dark-icon").forEach(el => el.style.display = isDark ? "block" : "none");
    document.querySelectorAll(".light-icon").forEach(el => el.style.display = isDark ? "none" : "block");
  }
  syncIcons();
  document.querySelectorAll("[data-theme-toggle]").forEach(btn => btn.addEventListener("click", () => setTimeout(syncIcons, 0)));

  document.getElementById("logoutBtn").addEventListener("click", logoutAdmin);

  let activeTab = "pending";
  document.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-tab]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeTab = btn.dataset.tab;
      renderAdminOrders("ordersList", activeTab);
    });
  });

  window.onOrderCompleted = () => {
    // kalau lagi di tab pending, list otomatis refresh dari renderAdminOrders itu sendiri
  };

  (async function init() {
    const allowed = await guardAdminPage();
    if (!allowed) return;
    document.getElementById("adminShell").style.display = "block";
    renderAdminOrders("ordersList", activeTab);
  })();
</script>
</body>
</html>
